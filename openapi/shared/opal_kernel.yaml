    config_save:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      post:
        tags:
        - config
        summary: Save configuration snapshot
        operationId: opal_config_save
        description: 'Capture the module''s persistent desired configuration as a portable snapshot.
          `destination: managed` (default) atomically creates or replaces the module''s single default
          managed snapshot - an explicit recovery snapshot, separate from live persisted configuration;
          a failed write preserves the previous managed snapshot and does not report success.
          `destination: response` returns the snapshot in the body for the caller to store (CLI
          `config save --out FILE`); it never replaces the managed snapshot. Save is not a
          live-configuration mutation: no If-Match and no live-revision bump. The response ETag carries
          the captured live-configuration revision.'
