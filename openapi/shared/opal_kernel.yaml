                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
              ETag:
                $ref: '#/components/headers/ETag'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalConfigSaveResult'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
          '500':
