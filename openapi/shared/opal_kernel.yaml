              target: snapshot
    config_load:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      post:
        tags:
        - config
        summary: Load configuration snapshot
        operationId: opal_config_load
        description: 'Atomically replace the module''s complete persistent portable configuration -
          settings overrides and declarative resource collections - with a snapshot. Omit the body or
          send `{}` to load the default managed snapshot (404 when none exists); a supplied `snapshot`
          selects that candidate; an explicit null is invalid. This is replacement, not merge: omitted
          registered setting overrides revert to defaults and omitted resource collections become empty,
          subject to module invariants. Resource identifiers and references are preserved, never
          regenerated. Validation of the entire candidate precedes any change; a failure, stale revision,
          invalid resource reference, or incompatible snapshot leaves the previous configuration intact -
          the revision check and all changes apply in one atomic unit. Loading executes no actions,
          starts no pipelines, downloads no models, and restarts no process; supported live settings
          activate and restart-only fields are reported in `pending_restart_fields`. Loading never
          overwrites the managed snapshot with pre-load live state, and never mutates another module or
          the authoritative persona registry (restored owner-linked records remain subject to the
          owner-resolution policy). Strong If-Match is mandatory: 428 when missing, 412 when stale.'
        parameters:
        - $ref: '#/components/parameters/IfMatch'
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalConfigLoadRequest'
        responses:
          '200':
            description: Load result; ETag carries the new live-configuration revision.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
              ETag:
                $ref: '#/components/headers/ETag'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalConfigLoadResult'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '409':
            $ref: '#/components/responses/Conflict'
          '412':
            $ref: '#/components/responses/PreconditionFailed'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
          '428':
            $ref: '#/components/responses/PreconditionRequired'
          '500':
            $ref: '#/components/responses/OperationFailed'
        x-opal-cli:
          group: config
          command: load
          options:
          - flag: --in
            value: FILE
            binds:
              kind: local_in
              target: snapshot
              parse: yaml_or_json_file
    config_validate:
