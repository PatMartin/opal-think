# OPAL Suite Kernel — shared contract base for all OPAL service specs.
# Consumed via external $ref; never published standalone. See info.description.

openapi: 3.1.0
info:
  title: OPAL Suite Kernel
  version: '0.1.0'
  description: 'Shared contract kernel for the OPAL suite (SUITE STANDARD v3.0.0).


    This document is never served directly. Service specs under `openapi/` mount its reusable Path Items and reference
    its components via external `$ref`s; published single-file artifacts are produced by `npm run bundle`.


    Conventions encoded here: the four X-Opal-* correlation headers on every request and response; strong ETag +
    mandatory If-Match on mutable configuration (428 missing, 412 stale); 204 for empty deletion; 201 + Location
    for creation; the OpalError envelope for all 4xx/5xx JSON bodies; and the standard health/settings/config/profiles/engines
    route families. If-Match concurrency covers portable logical configuration only: `config load`, `config
    setting set`, and `config setting remove` require it; runtime-data deletes (events, executions, failed
    utterances, sessions) are exempt by design; `config save` and `config validate` neither mutate live
    configuration nor bump the live revision, so they take no If-Match. Collections return bounded arrays;
    list endpoints that can grow unboundedly declare the `limit` query parameter (server caps apply); opaque cursors
    are used only where bounded arrays cannot bound a dataset. Configuration save/load/validate replaces the
    retired backup/restore and export/import interfaces; snapshots capture persistent desired configuration
    only - never history, sessions, binaries, secrets, or observed runtime inventory.


    Kernel schemas are deliberately open (`additionalProperties: true`) on union types: suite-standard required
    fields are normative, and each service layers its own domain fields on top. The namespaced profile
    schemas (`OpalProfile`, `OpalProfileCreate`, `OpalProfilePatch`, v3.0.0) are the documented exception:
    their envelopes are closed, module-owned fields live only inside `shared` and per-module `modules`
    compartments declared in this document, and lifecycle semantics are defined by `x-opal-profiles`.'
paths: {}
x-opal-authorization:
  version: '1.0'
  description: Suite REST authentication and authorization semantics. Loopback-only deployments may explicitly disable
    authentication; non-loopback deployments require authentication. Privileged configuration operations require
    authorization. 401 means missing or invalid authentication; 403 means authenticated but not permitted. Correlation
    IDs are never authorization credentials. Secret values must not appear in responses, exports, or error details.
  semantics:
    missing_or_invalid_credentials: '401'
    authenticated_but_not_permitted: '403'
    loopback: authentication may be explicitly disabled on loopback deployments
    non_loopback: authentication required
    privileged_operations: authorization required for configuration mutations
    credentials: correlation headers are transport context, never authorization credentials
    secrets: secret values must not appear in responses, exports, or error details
x-opal-event-envelope:
  propagate:
  - session_id
  - transaction_id
  - request_id
  - causation_id
  zero_mq_frames: 2
  compatibility: metadata_schema_version versions the optional data.metadata block only; the two-frame wire envelope
    (topic + JSON with topic/data) is unchanged across versions. Consumers extract known correlation keys (session_id,
    transaction_id, request_id, causation_id) and MUST ignore unknown metadata fields; producers may emit any metadata_schema_version
    without breaking the wire contract.
x-opal-cli-format:
  version: '1.0'
  description: Canonical CLI binding for OPAL operations. Every annotated operation maps to one canonical
    command `opal <service> [parent] [group] <command>`; `aliases` names alternate complete spellings that dispatch
    to the same operation (e.g. Think's `ask`/`chat`/`create` invoke `task add`). Kernel Path Items carry
    per-operation descriptors directly and are the single source of truth for shared-operation bindings,
    including all `config`/`config setting`, `info`, `service`, `profile`, and `persona` commands.
    Readers hoist
    a path-level
    per-method map onto each
    operation for module-declared mounts; both forms carry the same descriptor shape.
  descriptor:
    command: required - canonical verb, kebab-case (`list`, `add`, `show`, `update`, `remove`, `save`,
      `load`, `validate`, ...)
    group: optional - command group (`task`, `persona`, `setting`, `info`, ...)
    parent: optional - super-group above `group` (`config`, `data`)
    aliases: optional - array of alternate complete command spellings for this operation
    options: optional - array of named-option descriptors; each carries `flag` (long option spelling),
      `value` (metavar such as NAME/VALUE/FILE), `required` (default false), optional `description`, and
      `binds` describing how the option feeds the REST call - `{kind, target, parse?}` with kind `path` |
      `query` | `body` | `header` | `local_in` | `local_out`.
  placement:
    operation: '`x-opal-cli: <descriptor>`'
    path_item: '`x-opal-cli: {<method>: <descriptor>}` - for module-declared bindings on a `$ref`-mounted
      path item (an extension beside `$ref` cannot inject into operations defined in another document).
      Kernel-owned Path Items use the operation form instead.'
  local_file_options:
    local_in: The CLI reads and parses a client-local file, then submits the parsed object in the request
      body at `target`. The service never sees the client filename. For snapshot operations, `.yaml`/`.yml`
      select YAML parsing and `.json` selects JSON; other extensions are client errors, never server errors.
      Profile operations use the same convention for nested structured input - `--in FILE` targets the
      whole request body (the portable profile document or patch document), `--shared FILE` targets
      `shared`, and `--module FILE` targets `modules.<module-key>`, a placeholder the receiving
      service substitutes with its own declared compartment key
      (`x-opal-profile-namespace.compartment`) when generating commands, so a published binding
      reads e.g. `modules.opal-say` on opal-say.
    local_out: The CLI writes the named response field to a client-local file, serialized as YAML for
      `.yaml`/`.yml` or JSON for `.json`; other extensions are client errors. The service never sees the
      client filename. For `config save`, `--out FILE` also switches request `destination` to `response`
      so no managed snapshot is written.
    parse_json_or_string: For `config setting set --value`, the CLI parses the argument as JSON first; valid
      JSON becomes the native JSON value, otherwise the exact string is sent. JSON `null` is a nullable
      value, never a deletion instruction.
  example:
    parent: config
    group: persona
    command: list
x-opal-persona:
  version: '1.0'
  description: >-
    Portable OPAL persona contract. A persona is an identity with optional
    per-service bindings. OPAL Think hosts the authoritative registry; every
    service keeps full local CRUD for standalone operation, and the owner
    record wins on conflict when a consumer is configured to reach it.
  ownership:
    authoritative_writer: OPAL Think
    obtain: >-
      Consumers resolve an unknown persona_id from
      GET {owner_url}/api/v1/persona/{persona_id}, cache it with its ETag
      (origin: owner), and revalidate on use. No owner_url means standalone:
      local personas only.
    conflict: owner record wins when owner_url is configured; local records are retained.
  profiles_vs_personas:
    profile: >-
      A profile is a portable document of named presets: a `shared` section
      plus one compartment per module (`modules.<module-id>`), stored locally
      by each service. At most one profile is active per service at a time —
      a local runtime/configuration selection, not part of the portable
      payload; an empty local catalog is legal. The active profile's shared
      values and the service's own compartment fill in any setting a request
      leaves out. See `x-opal-profiles`.
    persona: >-
      A persona is an identity — who the user interacts with — that can carry
      service-specific bindings (a Say voice, Think model/instructions). New
      users pick a persona when they want a consistent character across
      requests without repeating its bound settings.
    difference: >-
      Profiles change what a service does by default; personas change who the
      service is for the user. They compose: the persona's bindings sit
      between the selected profile and explicit request fields in resolution.
  resolution:
    order: explicit request field > persona binding > selected profile's module override > selected profile's shared value > service default
    per_field: true
  bindings:
    voice_id: OPAL Say validates resolvability; other services treat it as an opaque nullable reference.
    think: model/instructions binding lives in Think's service-local fields; Think validates.
    validation: >-
      POST /api/v1/persona/{persona_id}/validate reports that service's
      binding resolvability, not a suite-wide verdict.
  errors:
    unknown_persona: 404 on read, 422 when referenced by a request
    binding_unresolvable: 422 on use; /validate reports it without deleting the persona
    disabled: 422/409 on use; record and bindings remain readable
  examples:
    think_only:
      persona_id: amy
      name: Amy
      enabled: true
      description: Persona with only a Think model/instructions binding (service-local fields).
    say_only:
      persona_id: vox
      name: Vox
      voice_id: en-gb-alan-low
      enabled: true
      description: Persona with only a Say voice binding.
    combined:
      persona_id: amy
      name: Amy
      description: Ops assistant.
      voice_id: en-gb-alan-low
      enabled: true
      origin: owner
      description_of_example: Think model + instructions plus a Say voice, synced from the owner.
x-opal-profiles:
  version: '1.0'
  description: >-
    Portable namespaced OPAL profile contract. A profile is one document
    carrying a `shared` object plus a `modules` map of module-owned
    compartments keyed by canonical module identity. Each service stores its
    own local profile records, reads only `shared` and its own compartment,
    and preserves all other compartments verbatim. Namespace schemas and the
    compartment catalog live in this document's `components.schemas`.
  storage:
    locality: >-
      Profiles are per-service local configuration. A portable document may
      hold compartments for many modules; copying or loading it transfers an
      explicit snapshot into the receiving service's local record. Edits
      affect only the receiving service's copy - propagating an updated
      compartment to another service requires explicitly transferring the
      configuration (config save on the source, config load on the target).
    activation: >-
      Active selection is local runtime/configuration state: at most one
      profile is active per service, and an empty local catalog is legal.
      `is_active` on responses is a read projection of that local selection,
      not portable payload; it is stored so config save/load restores the
      selection coherently. On select, the service applies `shared` plus its
      own compartment; missing compartments mean no profile overrides (the
      existing defaults apply).
    lifecycle: >-
      Profile edits apply to new work admitted after the edit; work already
      admitted keeps the resolved values it was admitted under, consistent
      with each service's existing lifecycle guarantees.
  patch_semantics: >-
    Ordinary partial edits may change `name`, `description`, `is_active`,
    `shared` and the receiving module's own compartment only. Omitted
    properties stay unchanged; a supplied compartment merges field-wise so
    sibling fields and all other compartments are preserved; arrays replace
    as whole values; explicit JSON `null` on a compartment field removes that
    override and restores inheritance (distinct from stored `null` values a
    field declares as meaningful, e.g. `sample_rate`). Attempting to change
    another module's compartment is rejected with 422 and its stored contents
    are preserved. Patches and validation failures are atomic: nothing
    partial is persisted.
  validation: >-
    `shared` and every declared compartment are validated structurally
    against the kernel's namespace schemas (closed objects). The receiving
    module additionally validates its own compartment's local resource
    references semantically (e.g. opal-say checks `voice_id` resolvability);
    foreign voice/model/pipeline references are portable references and are
    not resolved by non-owning services. Well-formed compartments for
    unrecognized module ids are preserved verbatim and reported as
    unverified where a reporting surface exists.
  creation: >-
    Creation and config load may ingest a full portable document with
    compartments for multiple modules, subject to normal authorization and
    validation. Omitted `shared`/`modules` normalize to empty objects; a
    stored complete record always carries both as objects.
  migration: >-
    v3.0.0 replaces the v2 flat profile union. The old-field-to-new-path
    table, runtime persistence obligations and affected consumers are
    recorded in docs/PROFILE_MIGRATION.md.
components:
  headers:
    OpalSessionIdHeader:
      description: Effective OPAL session context for this response. Returned when a session identifier is known;
        conditionally present.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalTransactionIdHeader:
      description: Logical transaction identifier for this exchange. Always returned; generated when the inbound
        request lacks one.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalRequestIdHeader:
      description: Identifier of this inbound HTTP exchange. Always returned; regenerated for each downstream hop.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalCausationIdHeader:
      description: Immediate parent event/request identifier for this response. Returned when applicable; conditionally
        present.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      description: Strong revision of the portable logical configuration.
      schema:
        type: string
    Location:
      description: Canonical path of created resource.
      schema:
        type: string
  parameters:
    OpalSessionIdParameter:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalTransactionIdParameter:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalRequestIdParameter:
      name: X-Opal-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalCausationIdParameter:
      name: X-Opal-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Required current strong ETag of the complete logical configuration. Missing returns 428, stale
        returns 412. One exact strong quoted tag required; weak tags, lists and * are rejected with 422.
      schema:
        type: string
        pattern: ^"[^"]+"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional caller-scoped deduplication key for admissions that accept it. Repeating a request
        with the same key and an identical request body replays the original admission result; reusing the key
        with a different body is rejected with 409 Conflict. Each service documents which operations honor the
        key and how long key/fingerprint records are retained.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Maximum items to return. Suite cap is 500; callers needing more must
        narrow with filters. Applies only to growing collections; bounded catalogs return
        everything.
    SettingKey:
      name: key
      in: path
      required: true
      description: Setting key.
      schema:
        type: string
        minLength: 1
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: Profile identifier.
      schema:
        type: string
        minLength: 1
      example: home
    EngineId:
      name: engine_id
      in: path
      required: true
      description: Stable implementation-defined identifier of an installed TTS engine.
      schema:
        type: string
        minLength: 1
      example: piper
    ServiceLogLines:
      name: lines
      in: query
      required: false
      description: Number of trailing log lines to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    OpalPersonaIdParameter:
      name: persona_id
      in: path
      required: true
      description: Globally unique OPAL persona identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: amy
  responses:
    BadRequest:
      description: Malformed request syntax or invalid parameter encoding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Forbidden:
      description: Authenticated but not permitted for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PreconditionFailed:
      description: 'If-Match precondition failed: the supplied ETag is stale.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PayloadTooLarge:
      description: Request payload exceeds the advertised limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PreconditionRequired:
      description: If-Match precondition required but missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    UnprocessableEntity:
      description: Request was well-formed but failed semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    TooManyRequests:
      description: Rate limit exceeded; retry after the advertised interval.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    OperationFailed:
      description: The operation was accepted but failed during execution.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    ServiceUnavailable:
      description: The service or a required dependency is currently unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
  schemas:
    OpalErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable diagnostic.
        details:
          description: Structured diagnostic detail; shape is code-specific.
        request_id:
          type: string
        transaction_id:
          type: string
        session_id:
          type:
          - string
          - 'null'
        causation_id:
          type:
          - string
          - 'null'
        retryable:
          type: boolean
          description: Whether the caller may retry the same request.
      required:
      - code
      - message
      - request_id
      - transaction_id
      additionalProperties: false
      description: Canonical OPAL suite error body; correlation identifiers mirror the response headers.
    OpalError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/OpalErrorBody'
      required:
      - error
      additionalProperties: false
      description: Standard OPAL error envelope for all 4xx/5xx JSON responses.
    OpalHealthProbe:
      type: object
      required:
      - status
      - ready
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        ready:
          type: boolean
        details:
          type: object
          additionalProperties: true
        version:
          type: string
          description: Service implementation version; conditionally present.
      additionalProperties: true
    OpalHealthReport:
      type: object
      properties:
        name:
          type: string
          description: Service implementation name.
          example: opal-say-svc
        version:
          type: string
          description: Service implementation (package) version.
          example: 1.0.0
        api_version:
          type: string
          description: OPAL API contract version.
          example: v1
        status:
          type: string
          enum:
          - ok
          - degraded
          - error
          description: Overall state using the canonical vocabulary. `degraded` and `error` reports still
            return HTTP 200 whenever the report itself can be produced.
        live:
          type: boolean
          description: True while the service process is alive. Carries the information the retired
            `GET /api/v1/info/ping` route and `info ping`/`info live` commands used to report.
        ready:
          type: boolean
          description: True when the service can perform useful work. May be false while `live` stays
            true; the report still returns HTTP 200 whenever it is available.
        details:
          type: object
          additionalProperties: true
          description: 'Module-defined diagnostics, always present (empty object when a module reports no
            extra diagnostics). Each module declares its known members via its `x-opal-health-details`
            extension: `stats` carries opal-event''s event and execution counters; `audio_devices` carries
            opal-listen''s host input device list. Diagnostics that older revisions returned at the top
            level (`engines`, `checks`, `components`, `metrics`, `models_available`, `broker_running`,
            `database_ready`, `event`, `active_tasks`) now live under this object with their existing
            meaning and access requirements.'
        active_profile_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Locally active profile id, or null when no profile is active.
        checked_at:
          type: string
          format: date-time
          description: Time this report was assembled.
        uptime_seconds:
          type: number
          minimum: 0
        pending_restart:
          anyOf:
          - type: boolean
          - type: array
            items:
              type: string
          description: Restart-pending indicator (boolean) or list of pending fields (array); `pending_restart_fields`
            is the canonical list form.
        pending_restart_fields:
          type: array
          items:
            type: string
      required:
      - name
      - version
      - api_version
      - status
      - live
      - ready
      - details
      additionalProperties: true
      description: Aggregate service health report - the single source for service identity, liveness,
        readiness and diagnostics. Replaces the retired `GET /api/v1/info/` and `GET /api/v1/info/ping`
        reports; module-defined diagnostics live under `details`.
    SettingRead:
      type: object
      properties:
        id:
          title: Id
          type: integer
        key:
          title: Key
          type: string
        value:
          title: Value
          description: Effective native JSON value after environment and .env overlays.
        configured_value:
          title: Configured Value
          description: Persistent desired value before environment/.env overlays; equals the registered
            default when no override exists.
        updated_at:
          format: date-time
          title: Updated At
          type: string
        default:
          description: Registered default native JSON value, when safe to expose.
        has_override:
          type: boolean
          description: True when a persistent user override exists for this key.
        is_default:
          type: boolean
          description: True when the effective value comes from the registered default (provenance, not
            value equality).
        source:
          type: string
          enum:
          - default
          - persisted
          - dotenv
          - environment
          description: 'Provenance of the effective value. Precedence, highest first: environment, dotenv,
            persisted, default.'
        restart_required:
          type: boolean
          description: True when changing this setting requires a service restart to take effect.
        pending_restart:
          type: boolean
          description: 'For restart-only settings, true when the desired effective value diverges from the
            currently running value. An environment-masked persistent edit reports masked (via
            `source`/`configured_value`), not pending_restart.'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/OpalValidationIssue'
          description: Structured warnings, e.g. an environment overlay masking the persisted value.
      required:
      - key
      - value
      - configured_value
      - default
      - has_override
      - is_default
      - source
      - restart_required
      - pending_restart
      additionalProperties: true
      description: One setting record with effective/configured/default values and provenance metadata.
        Lifecycle metadata such as `pending_restart_fields` never appears inside the settings map itself.
    SettingUpdate:
      type: object
      properties:
        value:
          description: New native JSON value for the setting.
      required:
      - value
      additionalProperties: false
      description: Replacement value for a single setting key.
    OpalSettingsMap:
      type: object
      additionalProperties: true
      description: 'The complete portable settings map: flat map of registered setting keys to effective
        native JSON values. Secret material is never included. Lifecycle metadata such as
        `pending_restart_fields` is never mixed into this map.'
    OpalValidationReport:
      type: object
      properties:
        valid:
          type: boolean
          description: True when the validated object/configuration is usable under current validation rules.
        errors:
          type: array
          items:
            anyOf:
            - type: string
            - type: object
          description: Diagnostic entries (errors); string or structured object per service.
        warnings:
          type: array
          items:
            anyOf:
            - type: string
            - type: object
          description: Diagnostic entries (warnings); string or structured object per service.
        details:
          type: object
          additionalProperties: true
          description: Optional implementation-specific validation details.
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Service-defined section.
        resolved_capabilities:
          type: array
          items:
            type: string
        estimated_resources:
          type: object
          additionalProperties: true
      required:
      - valid
      additionalProperties: true
      description: Non-mutating validation result. `valid` is suite-standard; remaining fields describe per-service
        diagnostics.
    OpalValidationIssue:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable issue or warning code.
        path:
          type: string
          description: 'Field or resource path the issue applies to (e.g. `settings.vad.threshold`,
            `resources.profiles[2].id`); empty string for whole-snapshot issues.'
        message:
          type: string
          description: Human-readable description of the issue.
      required:
      - code
      - path
      - message
      additionalProperties: true
      description: One structured validation issue or warning.
    OpalConfigSnapshot:
      type: object
      properties:
        format_version:
          type: string
          description: Snapshot envelope format version. This contract accepts `1.0.0` only; other
            versions are rejected explicitly.
        module:
          type: string
          minLength: 1
          description: 'Canonical module identity (e.g. `opal-listen`). Snapshots for a different module
            are rejected before application.'
        created_at:
          type: string
          format: date-time
        settings:
          type: object
          additionalProperties: true
          description: 'Flat map of registered setting-key overrides to native JSON values (booleans,
            numbers, arrays and objects are never stringified). Unknown setting keys are rejected
            explicitly.'
        resources:
          type: object
          additionalProperties: true
          description: 'Module-owned declarative configuration sections (e.g. profiles, personas, engine
            configurations, voices, wakewords, intents, slots, rules, actions, device definitions, peers,
            groups, sharing policies, orchestrator service definitions). `profiles` carries complete
            namespaced profile documents - every stored module compartment and the local `is_active`
            selection - and foreign compartments are preserved verbatim through save/load. Each module
            declares its sections via `x-opal-snapshot.resources`; unknown sections are
            rejected explicitly.'
      required:
      - format_version
      - module
      - created_at
      - settings
      - resources
      additionalProperties: false
      description: 'Versioned portable configuration snapshot. Closed envelope: `settings` and `resources`
        are the only variable slots. Contains persistent desired configuration only: credential references
        but never secret values; never history, sessions, tasks, streams, generated media, model binaries,
        hardware-discovery caches, database files, runtime IDs, or synchronization status.'
    OpalConfigSaveRequest:
      type: object
      properties:
        destination:
          type: string
          enum:
          - managed
          - response
          default: managed
          description: '`managed` atomically creates or replaces the module''s default managed snapshot;
            `response` returns the snapshot in the body for the caller to store (CLI `config save --out`
            maps here) and never replaces the managed snapshot.'
      additionalProperties: false
    OpalConfigSaveResult:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/OpalConfigSnapshot'
        managed:
          type: boolean
          description: True when the default managed snapshot was written.
      required:
      - snapshot
      - managed
      additionalProperties: true
    OpalConfigLoadRequest:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/OpalConfigSnapshot'
          description: 'Candidate snapshot. Omit or send `{}` to load the managed snapshot; an explicit
            null is invalid.'
      additionalProperties: false
    OpalConfigLoadResult:
      type: object
      properties:
        applied:
          type: boolean
          const: true
          description: 'Always true on HTTP 200; failed loads use the shared error envelope, never
            `applied: false`.'
        pending_restart_fields:
          type: array
          items:
            type: string
          description: Setting keys whose new values require a service restart to take effect.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/OpalValidationIssue'
      required:
      - applied
      additionalProperties: true
    OpalConfigValidateRequest:
      type: object
      properties:
        snapshot:
          type: object
          description: 'Candidate snapshot to validate. Typed loosely as a JSON object so malformed
            envelopes are reported as structured issues rather than rejected as a malformed request;
            an explicit null is invalid. Omit to validate the current live configuration.'
      additionalProperties: false
    OpalConfigValidation:
      type: object
      properties:
        valid:
          type: boolean
          description: True exactly when `errors` is empty.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OpalValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/OpalValidationIssue'
      required:
      - valid
      - errors
      - warnings
      additionalProperties: true
      description: 'Non-mutating configuration validation result. Load performs equivalent checks
        internally; a prior successful validate call never bypasses load checks.'
    OpalLifecycleStatus:
      type: string
      description: 'Shared lifecycle vocabulary for asynchronous work (tasks, executions,
        steps). Terminal states are completed, failed, cancelled, and timed_out. A service may
        document additional terminal states for its own semantics — for example EVENT adds
        dropped for executions lost to queue saturation — but it must use these names for
        these concepts.'
      enum:
      - queued
      - running
      - completed
      - failed
      - cancelled
      - timed_out
    OpalProfile:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
          description: Opaque profile identifier.
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        is_active:
          type: boolean
          description: 'Local projection of this service''s active-profile selection, not portable
            payload. At most one profile reports true in a service''s local catalog; config save/load
            stores and restores it so the local selection survives transfer.'
        shared:
          $ref: '#/components/schemas/OpalProfileShared'
        modules:
          $ref: '#/components/schemas/OpalProfileModules'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - is_active
      - name
      - shared
      - modules
      additionalProperties: false
      description: 'A complete local profile record: identity, display metadata, a `shared` section and
        a `modules` map of module-owned compartments (catalog in `OpalProfileModules`). `shared` and
        `modules` are required and always objects - empty objects and missing module compartments are
        valid. The envelope is closed: undeclared fields are rejected. Exactly one active profile per
        service is the local ceiling; zero is legal. Lifecycle semantics are defined by
        `x-opal-profiles`.'
      example:
        id: studio
        name: Studio defaults
        description: Reusable defaults across OPAL modules
        is_active: true
        shared: {}
        modules:
          opal-say:
            voice_id: en-us-lessac-medium
            speed: 1.1
            sample_rate: null
          opal-listen:
            wakeword_names:
            - hey_opal
            enabled_intents:
            - lights_on
          opal-look: {}
        created_at: '2026-01-01T00:00:00Z'
        updated_at: '2026-01-02T00:00:00Z'
    OpalProfileCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique or human-distinguishable profile name.
          example: Studio defaults
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        is_active:
          type: boolean
          default: false
          description: If true, activate this profile locally and deactivate all others.
        shared:
          $ref: '#/components/schemas/OpalProfileShared'
        modules:
          $ref: '#/components/schemas/OpalProfileModules'
        id:
          type: string
          minLength: 1
          description: Client-supplied profile identifier where supported.
      required:
      - name
      additionalProperties: false
      description: 'Profile creation request: a portable document that may carry compartments for
        multiple modules, which the receiving service stores verbatim while honoring only `shared` and
        its own compartment. `name` is required; omitted `shared` and `modules` normalize to empty
        objects, so a created record always carries both. `is_active: true` activates the new profile
        and deactivates all others. Closed envelope.'
      example:
        name: Studio defaults
        description: Reusable defaults across OPAL modules
        is_active: true
        modules:
          opal-say:
            voice_id: en-us-lessac-medium
            speed: 1.1
          opal-listen:
            enabled_slots:
            - city
    OpalProfilePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        is_active:
          type: boolean
          description: 'Setting true activates this profile locally and deactivates all others. Setting
            false leaves the local selection unchanged; it never produces a no-active-profile state by
            itself.'
        shared:
          $ref: '#/components/schemas/OpalProfileShared'
        modules:
          $ref: '#/components/schemas/OpalProfileModulesPatch'
      additionalProperties: false
      description: 'Partial profile update: only supplied fields change; omitted properties stay
        unchanged. A supplied compartment merges field-wise over the stored compartment - sibling
        fields and every other compartment are preserved. Arrays replace as whole values. Explicit
        JSON `null` on a compartment field removes that override and restores inheritance; `null` is
        rejected where a field is not nullable and compartments themselves must remain objects.
        `modules` may contain only the receiving service''s own compartment key - edits to another
        module''s compartment are rejected with 422 and preserved untouched. Patches are atomic.
        Closed envelope.'
      example:
        modules:
          opal-say:
            speed: 1.25
            voice_id: null
    # Profile namespace compartment schemas (canonical module identities as catalog keys).
    OpalProfileShared:
      type: object
      additionalProperties: false
      description: 'Shared profile values: fields with proven identical meaning across multiple modules.
        Starts empty - a field is promoted here only when two or more module contracts already accept it
        with the same name, type and semantics. Promotion records consumers, units, accepted values and
        the compartment mapping in docs/PROFILE_MIGRATION.md. Until then this is a closed empty object:
        any member is rejected.'
    OpalProfileModules:
      type: object
      properties:
        opal-event:
          $ref: '#/components/schemas/OpalEventProfileNamespace'
        opal-listen:
          $ref: '#/components/schemas/OpalListenProfileNamespace'
        opal-look:
          $ref: '#/components/schemas/OpalLookProfileNamespace'
        opal-look-yolo:
          $ref: '#/components/schemas/OpalYoloProfileNamespace'
        opal-say:
          $ref: '#/components/schemas/OpalSayProfileNamespace'
        opal-think:
          $ref: '#/components/schemas/OpalThinkProfileNamespace'
      additionalProperties:
        type: object
        description: Unrecognized module namespace. Any well-formed object is accepted and preserved
          verbatim through reads, own-compartment edits and config save/load; its validation status is
          unverified. Declared compartments above enforce their strict schemas.
      description: 'The reference-connected catalog of module-owned profile compartments, keyed by
        canonical module identity (`x-opal-snapshot.module`). Every participating runtime module,
        including nested engine contracts, is registered - modules with no profile-specific defaults use
        an explicit empty compartment schema. Each service stores and returns this complete map on
        profile records; it reads only `shared` and its own compartment, and preserves all others.'
    OpalProfileModulesPatch:
      type: object
      properties:
        opal-event:
          $ref: '#/components/schemas/OpalEventProfileNamespacePatch'
        opal-listen:
          $ref: '#/components/schemas/OpalListenProfileNamespacePatch'
        opal-look:
          $ref: '#/components/schemas/OpalLookProfileNamespacePatch'
        opal-look-yolo:
          $ref: '#/components/schemas/OpalYoloProfileNamespacePatch'
        opal-say:
          $ref: '#/components/schemas/OpalSayProfileNamespacePatch'
        opal-think:
          $ref: '#/components/schemas/OpalThinkProfileNamespacePatch'
      additionalProperties:
        type: object
        description: Unrecognized module namespace in a patch document. Structurally any object is
          accepted, but ordinary partial edits may target only the receiving service''s own compartment;
          a service rejects foreign compartment edits with 422 and preserves stored foreign contents.
      description: 'Patch catalog mirroring `OpalProfileModules`; compartment values use each module''s
        patch namespace where supplied fields merge field-wise over the stored compartment. Supplying any
        compartment key other than the receiving module''s own is rejected with 422 Unprocessable Entity.'
    OpalSayProfileNamespace:
      type: object
      properties:
        voice_id:
          type: string
          minLength: 1
          description: Registered OPAL Say voice used by default.
          example: en-us-lessac-medium
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          description: Default speaking-rate multiplier for generation.
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          description: Default output volume multiplier for generation.
        output_format:
          type: string
          description: Default audio output format; values are service-defined (e.g. 'wav', 'pcm').
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional default output sample rate. Stored `null` is an allowed value meaning
            the service chooses; it is not a deletion marker.
        engine_options:
          type: object
          additionalProperties: true
          description: Engine-specific option passthrough, shallow-merged under request-level
            `engine_options` during generation (request keys win). The engine-options extension point is
            unchanged.
      additionalProperties: false
      description: 'opal-say compartment: generation defaults migrated from the v2 flat profile fields
        `voice_id`, `speed`, `volume`, `output_format`, `sample_rate`, `engine_options`. All fields are
        optional overrides; omission inherits.'
    OpalSayProfileNamespacePatch:
      type: object
      properties:
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
        output_format:
          anyOf:
          - type: string
          - type: 'null'
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
        engine_options:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
      additionalProperties: false
      description: 'Patch form of the opal-say compartment. Supplied fields merge field-wise; explicit
        `null` removes that override and restores inheritance (`sample_rate` removal is equivalent to its
        stored null value: the service chooses). Non-object values and undeclared fields are rejected.'
    OpalListenProfileNamespace:
      type: object
      properties:
        wakeword_names:
          type: array
          items:
            type: string
          title: Wakeword Names
          description: Wakewords the recognition pipeline listens for by default.
        confidence_thresholds:
          type: object
          additionalProperties: true
          title: Confidence Thresholds
          description: Per-intent or global minimum recognition confidence overrides.
        vad_settings:
          type: object
          additionalProperties: true
          title: Vad Settings
          description: Voice-activity-detection overrides used by the recognition pipeline.
        enabled_intents:
          type: array
          items:
            type: string
          title: Enabled Intents
          description: Intent identifiers enabled by default.
        enabled_slots:
          type: array
          items:
            type: string
          title: Enabled Slots
          description: Slot identifiers enabled by default.
        model_paths:
          type: object
          additionalProperties:
            type: string
          title: Model Paths
          description: Named model-resource path overrides (e.g. stt, tts-adjacent assets).
      additionalProperties: false
      description: 'opal-listen compartment: recognition defaults migrated from the v2 flat profile
        fields `wakeword_names`, `confidence_thresholds`, `vad_settings`, `enabled_intents`,
        `enabled_slots`, `model_paths`. All fields are optional overrides; omission inherits.'
    OpalListenProfileNamespacePatch:
      type: object
      properties:
        wakeword_names:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Wakeword Names
        confidence_thresholds:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
          title: Confidence Thresholds
        vad_settings:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
          title: Vad Settings
        enabled_intents:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Enabled Intents
        enabled_slots:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Enabled Slots
        model_paths:
          anyOf:
          - type: object
            additionalProperties:
              type: string
          - type: 'null'
          title: Model Paths
      additionalProperties: false
      description: 'Patch form of the opal-listen compartment. Supplied fields merge field-wise; arrays
        replace as whole values; explicit `null` removes that override and restores inheritance.'
    OpalLookProfileNamespace:
      type: object
      additionalProperties: false
      description: 'opal-look compartment. Look currently declares no profile-specific defaults; this is
        an explicit empty closed schema so the compartment is registered, validated and round-tripped.
        Fields added later must be declared here before they are accepted.'
    OpalLookProfileNamespacePatch:
      type: object
      additionalProperties: false
      description: Patch form of the opal-look compartment. No fields are declared; any member is
        rejected until a declared field exists.
    OpalThinkProfileNamespace:
      type: object
      additionalProperties: false
      description: 'opal-think compartment. Think currently declares no profile-specific defaults; this
        is an explicit empty closed schema so the compartment is registered, validated and
        round-tripped.'
    OpalThinkProfileNamespacePatch:
      type: object
      additionalProperties: false
      description: Patch form of the opal-think compartment. No fields are declared; any member is
        rejected until a declared field exists.
    OpalEventProfileNamespace:
      type: object
      additionalProperties: false
      description: 'opal-event compartment. Event currently declares no profile-specific defaults; this
        is an explicit empty closed schema so the compartment is registered, validated and
        round-tripped.'
    OpalEventProfileNamespacePatch:
      type: object
      additionalProperties: false
      description: Patch form of the opal-event compartment. No fields are declared; any member is
        rejected until a declared field exists.
    OpalYoloProfileNamespace:
      type: object
      additionalProperties: false
      description: 'opal-look-yolo compartment. The nested YOLO engine adapter currently declares no
        profile-specific defaults; this is an explicit empty closed schema so the engine compartment is
        registered, validated and round-tripped like every other runtime module.'
    OpalYoloProfileNamespacePatch:
      type: object
      additionalProperties: false
      description: Patch form of the opal-look-yolo compartment. No fields are declared; any member is
        rejected until a declared field exists.

    OpalEngine:
      type: object
      properties:
        engine_id:
          type: string
          minLength: 1
          description: Stable engine identifier used by API requests and voice registrations.
          example: piper
        name:
          type: string
          minLength: 1
          description: Human-readable engine name.
          example: Piper
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional human-readable engine description.
          example: Local neural text-to-speech engine
        enabled:
          type: boolean
          description: Whether OPAL Say is administratively allowed to route generation to this engine.
          example: true
        available:
          type: boolean
          description: Whether the implementation can currently initialize and use the engine.
          example: true
        options:
          type: object
          additionalProperties: true
          description: Engine-specific option values.
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          description: 'Read-only implementation-reported engine metadata such as runtime version or

            adapter information. Clients must not require engine-specific metadata keys.

            '
          example:
            version: 1.3.0
        version:
          type: string
        state:
          type: string
          enum:
          - ready
          - unavailable
          - error
          - disabled
        tasks:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Service-defined section.
        device_types:
          type: array
          items:
            type: string
        options_schema:
          type: object
          additionalProperties: true
      required:
      - enabled
      - engine_id
      - name
      additionalProperties: true
      description: A host-installed engine known to the service. `engine_id`, `name` and `enabled` are suite-standard;
        `available` reports live usability. Engines are not created or deleted through this API.
    OpalEnginePatch:
      type: object
      minProperties: 1
      properties:
        enabled:
          type: boolean
          description: Enable or disable routing to this installed engine.
        options:
          type: object
          additionalProperties: true
          description: Engine-specific option values.
      required: []
      additionalProperties: true
      description: Partial engine configuration update; only supplied fields change.
    OpalServiceStartOptions:
      type: object
      properties:
        append:
          type: boolean
          default: false
          description: Append to the existing service log file instead of truncating it. By default
            `logs/opal_<service>.log` is overwritten on each start.
      required: []
      additionalProperties: true
      description: Options for service start.
    OpalServiceStatus:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - running
          - stopped
          description: Whether the service's server process is running after the operation.
        pid:
          anyOf:
          - type: integer
          - type: 'null'
          description: Process identifier of the running server; null when stopped or unknown.
        previous_pid:
          anyOf:
          - type: integer
          - type: 'null'
          description: Process identifier of a prior instance terminated by `service start`; null when none was
            running.
        log_file:
          type: string
          description: Path of the log file receiving server output (`logs/opal_<service>.log`).
      additionalProperties: true
      description: Lifecycle state of the service's server process as reported by start/stop.
    OpalServiceLogTail:
      type: object
      required:
      - lines
      properties:
        log_file:
          type: string
          description: Path of the service log file (`logs/opal_<service>.log`).
        lines:
          type: array
          items:
            type: string
          description: Trailing log lines, oldest first; at most `lines` entries.
      additionalProperties: true
      description: Trailing lines of the service log file.
    OpalPersonaCreate:
      type: object
      additionalProperties: false
      required:
      - persona_id
      - name
      properties:
        persona_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable persona name.
          example: Amy
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description or character notes.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Optional OPAL Say voice identifier associated with this persona.
          example: en-gb-alan-low
        enabled:
          type: boolean
          default: true
          description: Whether this persona may be selected.
      example:
        persona_id: amy
        name: Amy
        voice_id: en-gb-alan-low
        enabled: true
    OpalPersonaUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a persona.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Rebind the persona to a different OPAL Say voice identifier.
        enabled:
          type: boolean
    OpalPersonaRef:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    OpalPersonaRead:
      type: object
      required:
      - persona_id
      - name
      - enabled
      - created_at
      - updated_at
      properties:
        persona_id:
          type: string
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          example: Amy
        description:
          anyOf:
          - type: string
          - type: 'null'
        voice_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional OPAL Say voice identifier associated with this persona.
        enabled:
          type: boolean
        origin:
          type: string
          enum: [local, owner]
          default: local
          description: >-
            Provenance: `local` (authored here, standalone) or `owner` (synced
            from the authoritative registry at OPAL Think). Optional and
            additive; absent means `local`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
