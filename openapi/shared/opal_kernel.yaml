          '422':
            $ref: '#/components/responses/UnprocessableEntity'
          '428':
            $ref: '#/components/responses/PreconditionRequired'
        x-opal-cli:
          group: persona
          command: remove
          options:
          - flag: --if-match
            value: ETAG
            description: Strong If-Match precondition on the record revision (required).
            binds:
              kind: header
              target: If-Match
    persona_validate:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      - $ref: '#/components/parameters/OpalPersonaIdParameter'
      post:
        tags:
        - persona
        summary: Validate persona
        operationId: opal_persona_validate
        description: 'Evaluate one local persona record against the receiving service''s rules and
          return an `OpalValidationReport`. Read-only and service-local: no state changes. Each
          service validates the bindings it understands - opal-say checks voice and engine
          compatibility, opal-think checks its service-local model and instruction bindings,
          opal-look and opal-look-yolo validate the registered identity and enabled state; foreign
          bindings are opaque references. 404 means no such record; 422 reports invalid input.'
        responses:
          '200':
            description: Validation report for the persona.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalValidationReport'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
        x-opal-cli:
          group: persona
          command: validate
    service_start:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      post:
        tags:
        - service
        summary: Start service
        operationId: opal_service_start
        description: 'Start the service''s server process in the background and return immediately. Server output
          is written to `logs/opal_<service>.log`; the log file is overwritten by default unless `append` is
          requested. If another server process is already running it is terminated before the new one is launched,
          so `start` doubles as restart. The response reports the launched process; readiness is reported separately
          by `/api/v1/health/ready`.'
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalServiceStartOptions'
        responses:
          '200':
            description: Server process launched.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalServiceStatus'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
          '500':
            $ref: '#/components/responses/OperationFailed'
        x-opal-cli:
          group: service
          command: start
          options:
          - flag: --append
            description: Append to the existing service log instead of truncating it.
            binds:
              kind: body
              target: append
    service_stop:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      post:
        tags:
        - service
        summary: Stop service
        operationId: opal_service_stop
        description: Stop the service's server process if it is running. Not an error when no server is running;
          the response reports the resulting state.
        responses:
          '200':
            description: Resulting process state.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalServiceStatus'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
          '500':
            $ref: '#/components/responses/OperationFailed'
        x-opal-cli:
          group: service
          command: stop
    service_log:
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdParameter'
      - $ref: '#/components/parameters/OpalTransactionIdParameter'
      - $ref: '#/components/parameters/OpalRequestIdParameter'
      - $ref: '#/components/parameters/OpalCausationIdParameter'
      get:
        tags:
        - service
        summary: Tail service log
        operationId: opal_service_log
        description: Return the trailing lines of the service's log file (`logs/opal_<service>.log`); defaults
          to the last 10 lines.
        parameters:
        - $ref: '#/components/parameters/ServiceLogLines'
        responses:
          '200':
            description: Trailing log lines.
            headers:
              X-Opal-Session-Id:
                $ref: '#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: '#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: '#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: '#/components/headers/OpalCausationIdHeader'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpalServiceLogTail'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '403':
            $ref: '#/components/responses/Forbidden'
          '404':
            $ref: '#/components/responses/NotFound'
          '422':
            $ref: '#/components/responses/UnprocessableEntity'
        x-opal-cli:
          group: service
          command: log
          options:
          - flag: --lines
            value: N
            description: Number of trailing log lines to return (1-1000, default 10).
            binds:
              kind: query
              target: lines
