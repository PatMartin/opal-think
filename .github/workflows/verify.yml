name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ollama_url:
        description: Optional live Ollama base URL for the opt-in smoke job (leave empty to skip)
        required: false
        default: ""
      ollama_model:
        description: Model to exercise when ollama_url is set
        required: false
        default: "smollm:360m"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool run ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install --system -e ".[dev]"
      - name: deterministic suite (unit + contract + client + eval)
        run: pytest -q

  live-smoke:
    # Opt-in only: requires an operator-supplied Ollama; never runs on push/PR.
    if: github.event_name == 'workflow_dispatch' && inputs.ollama_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      - name: live Ollama smoke
        env:
          OPAL_THINK_LIVE_OLLAMA: ${{ inputs.ollama_url }}
          OPAL_THINK_LIVE_MODEL: ${{ inputs.ollama_model }}
        run: pytest tests/integration -q -rs
